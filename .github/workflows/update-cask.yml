# Publishes Casks/reliant.rb for every Reliant desktop release, with no human
# step.
#
# TRIGGERS. reliant's release.yml dispatches "release-published" once the
# release is out. The schedule is the safety net: every 30 minutes it compares
# this tap with https://downloads.reliantlabs.io/latest-mac.yml and publishes
# whatever a lost dispatch missed.
#
# THE GATE (what a human reviewer used to check):
#   1. both DMGs are downloaded, and each one's sha512 must equal the one the
#      release's own update manifest (latest-mac.yml, written by
#      electron-builder) records for it; the cask pins their sha256;
#   2. the patched cask must still have exactly the expected shape: the
#      `arch arm: "arm64", intel: "x64"` mapping intact (a sed bug once turned
#      it into a checksum, PRs #15-#26), one version line, both checksums;
#   3. brew-verify.sh: `brew install --cask` on macOS (which checks the DMG
#      against the cask's sha256) and the installed Reliant.app must report the
#      version.
# Only then does publish.sh push the one-file change to main, as the tap's
# deploy key (the only bypass of the "main" ruleset's review). Never a
# downgrade, never a prerelease.
#
# THE ALARM. The `staleness` job fails, and opens (or updates) the issue
# "Reliant on Homebrew is behind its latest release", when the cask stays
# behind latest-mac.yml for more than STALE_AFTER_HOURS.
#
# BY HAND. `gh workflow run update-cask.yml --repo reliant-labs/homebrew-reliant`
# (optionally `-f version=X.Y.Z`, `-f dry_run=true` to verify only).
name: Update Cask

on:
  repository_dispatch:
    types: [release-published]
  workflow_dispatch:
    inputs:
      version:
        description: "Reliant version (X.Y.Z); empty means the latest release"
        required: false
        type: string
      dry_run:
        description: "Verify only: run the whole gate for the version, publish nothing"
        type: boolean
        default: false
  schedule:
    - cron: "22,52 * * * *"

permissions:
  contents: read

concurrency:
  group: update-cask
  cancel-in-progress: false

env:
  MANIFEST_URL: https://downloads.reliantlabs.io/latest-mac.yml
  STALE_AFTER_HOURS: "3"
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      update: ${{ steps.resolve.outputs.update }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version to publish
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          latest="$(curl -fsSL --retry 5 --retry-all-errors "$MANIFEST_URL" | sed -n 's/^version: *//p' | head -n1)"
          requested="${INPUT_VERSION:-${PAYLOAD_VERSION:-$latest}}"
          requested="${requested#v}"
          # A request older than the manifest is already superseded: publish the newest.
          VERSION="$(printf '%s\n%s\n' "$requested" "$latest" | sort -V | tail -n1)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::not publishing '$VERSION' to Homebrew: only X.Y.Z releases are (prereleases never are)"
            echo "update=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          HAVE="$(.github/scripts/tap-version.sh cask || true)"
          echo "tap installs Reliant ${HAVE:-nothing}; latest-mac.yml says ${latest}; requested ${requested}"
          update=true
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run: verifying Reliant $VERSION; nothing will be published"
          elif [ "$HAVE" = "$VERSION" ]; then
            echo "Casks/reliant.rb already installs $VERSION; nothing to do"
            update=false
          elif [ -n "$HAVE" ] && [ "$(printf '%s\n%s\n' "$HAVE" "$VERSION" | sort -V | tail -n1)" = "$HAVE" ]; then
            echo "::notice::not downgrading Casks/reliant.rb from $HAVE to $VERSION"
            update=false
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "update=$update" >>"$GITHUB_OUTPUT"

  publish:
    needs: resolve
    if: needs.resolve.outputs.update == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      VERSION: ${{ needs.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy key is the only identity the "main" ruleset lets push
          # without a review. Unset, checkout falls back to GITHUB_TOKEN and
          # publish.sh opens a pull request instead.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Download both DMGs and check them against the release manifest
        id: sha256
        run: |
          # The dispatch can beat the manifest upload by a few minutes.
          for attempt in $(seq 1 40); do
            curl -fsSL --retry 5 --retry-all-errors "$MANIFEST_URL" -o "$RUNNER_TEMP/latest-mac.yml"
            [ "$(sed -n 's/^version: *//p' "$RUNNER_TEMP/latest-mac.yml" | head -n1)" = "$VERSION" ] && break
            if [ "$attempt" = 40 ]; then
              echo "::error::latest-mac.yml still does not describe $VERSION after 20 minutes"
              exit 1
            fi
            sleep 30
          done
          for arch in arm64 x64; do
            dmg="Reliant-${VERSION}-mac-${arch}.dmg"
            curl -fL --retry 5 --retry-all-errors --connect-timeout 30 --max-time 900 \
              "https://downloads.reliantlabs.io/$dmg" -o "$RUNNER_TEMP/$dmg"
            want="$(awk -v u="$dmg" '$1 == "-" && $2 == "url:" { hit = ($3 == u); next } hit && $1 == "sha512:" { print $2; exit }' "$RUNNER_TEMP/latest-mac.yml")"
            got="$(openssl dgst -sha512 -binary "$RUNNER_TEMP/$dmg" | base64 | tr -d '\n')"
            if [ -z "$want" ] || [ "$got" != "$want" ]; then
              echo "::error::$dmg: sha512 $got does not match latest-mac.yml ('$want')"
              exit 1
            fi
            sum="$(shasum -a 256 "$RUNNER_TEMP/$dmg" | awk '{print $1}')"
            echo "$dmg sha256 $sum (sha512 matches latest-mac.yml)"
            echo "sha_${arch}=$sum" >>"$GITHUB_OUTPUT"
            rm -f "$RUNNER_TEMP/$dmg"
          done

      - name: Update Casks/reliant.rb
        env:
          SHA_ARM64: ${{ steps.sha256.outputs.sha_arm64 }}
          SHA_X64: ${{ steps.sha256.outputs.sha_x64 }}
        run: |
          sed -i '' "s/^\( *\)version \".*\"/\1version \"${VERSION}\"/" Casks/reliant.rb
          sed -i '' "s/^\( *\)sha256 arm: *\".*\"/\1sha256 arm:   \"${SHA_ARM64}\"/" Casks/reliant.rb
          # Anchored to the indented continuation line of the sha256 stanza: a
          # bare `intel: "..."` also matches `arch arm: "arm64", intel: "x64"`,
          # which the sed of PRs #15-#26 rewrote into a checksum.
          sed -i '' "s/^\( *\)intel: \".*\"/\1intel: \"${SHA_X64}\"/" Casks/reliant.rb
          cat Casks/reliant.rb
          # The shape the gate verified, line for line.
          for want in \
            '  arch arm: "arm64", intel: "x64"' \
            "  version \"${VERSION}\"" \
            "  sha256 arm:   \"${SHA_ARM64}\"," \
            "         intel: \"${SHA_X64}\""; do
            if [ "$(grep -cxF "$want" Casks/reliant.rb)" != 1 ]; then
              echo "::error::Casks/reliant.rb does not contain exactly one line '$want'"
              exit 1
            fi
          done

      - name: brew install the cask (macOS)
        run: .github/scripts/brew-verify.sh cask "$VERSION"

      - name: Publish to main
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY_CONFIGURED: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        run: .github/scripts/publish.sh cask "$VERSION" "reliant $VERSION"

  staleness:
    needs: [resolve, publish]
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail and raise an issue if the tap is behind the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          HAVE="$(.github/scripts/tap-version.sh cask origin/main || true)"
          curl -fsSL --retry 5 --retry-all-errors "$MANIFEST_URL" -o manifest.yml
          LATEST="$(sed -n 's/^version: *//p' manifest.yml | head -n1)"
          RELEASED_AT="$(sed -n "s/^releaseDate: *'*\([^']*\)'*/\1/p" manifest.yml | head -n1)"
          rm manifest.yml
          if ! echo "$LATEST" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::notice::latest-mac.yml names '$LATEST', which is not published to Homebrew"
            exit 0
          fi
          .github/scripts/staleness.sh Reliant "$HAVE" "$LATEST" "$RELEASED_AT" "$STALE_AFTER_HOURS"
