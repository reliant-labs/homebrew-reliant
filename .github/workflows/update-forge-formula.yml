# Publishes Formula/forge.rb for every forge release, with no human step.
#
# TRIGGERS. forge's scripts/release-forge.sh dispatches "forge-release-published"
# the moment a release is created. The schedule is the safety net: every 30
# minutes it compares this tap with forge's latest release and publishes
# whatever a lost dispatch missed. A bump therefore never waits on a person.
#
# THE GATE (what a human reviewer used to check), in order:
#   1. render-forge-formula.sh: the release's archives and checksums.txt verify
#      against forge's Sigstore release signature (release-attest.yml, the
#      identity install.sh and the npm shim pin); every archive matches
#      checksums.txt; the formula is rendered by the tag's own
#      scripts/render-homebrew-formula.sh and every url/sha256 in it is
#      re-checked against the signed checksums.txt;
#   2. brew-verify.sh on macOS (arm64) and Linux (amd64): `brew install`,
#      `brew test`, and the installed `forge version` must name the release;
#   3. both legs must render a byte-identical formula.
# Only then does publish.sh push the one-file change to main, as the tap's
# deploy key (the only bypass of the "main" ruleset's review). Never a
# downgrade, never a prerelease.
#
# THE ALARM. The `staleness` job runs after every trigger: if the tap installs an
# older forge than the latest release for more than STALE_AFTER_HOURS, it fails
# and opens (or updates) the issue "forge on Homebrew is behind its latest
# release"; catching up closes it.
#
# BY HAND. Re-publish a version: `gh workflow run update-forge-formula.yml
# --repo reliant-labs/homebrew-reliant -f version=X.Y.Z`. Verify without
# publishing: add `-f dry_run=true`.
name: Update forge formula

on:
  repository_dispatch:
    types: [forge-release-published]
  workflow_dispatch:
    inputs:
      version:
        description: "forge version (X.Y.Z); empty means the latest release"
        required: false
        type: string
      dry_run:
        description: "Verify only: run the whole gate for the version, publish nothing"
        type: boolean
        default: false
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: read

# A dispatch and a scheduled run must not race; the second finds main current.
concurrency:
  group: update-forge-formula
  cancel-in-progress: false

env:
  STALE_AFTER_HOURS: "3"
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      update: ${{ steps.resolve.outputs.update }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version to publish
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          PAYLOAD_VERSION: ${{ github.event.client_payload.version }}
        run: |
          latest="$(gh api repos/reliant-labs/forge/releases/latest --jq .tag_name)"
          VERSION="${INPUT_VERSION:-${PAYLOAD_VERSION:-$latest}}"
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::version must look like X.Y.Z (got: '$VERSION'); prereleases are not published to Homebrew"
            exit 1
          fi
          HAVE="$(.github/scripts/tap-version.sh formula || true)"
          echo "tap installs forge ${HAVE:-nothing}; latest release ${latest}; requested ${VERSION}"
          update=true
          if [ "$DRY_RUN" = "true" ]; then
            echo "::notice::dry run: verifying forge $VERSION; nothing will be published"
          elif [ "$HAVE" = "$VERSION" ]; then
            echo "Formula/forge.rb already installs $VERSION; nothing to do"
            update=false
          elif [ -n "$HAVE" ] && [ "$(printf '%s\n%s\n' "$HAVE" "$VERSION" | sort -V | tail -n1)" = "$HAVE" ]; then
            echo "::notice::not downgrading Formula/forge.rb from $HAVE to $VERSION"
            update=false
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          echo "update=$update" >>"$GITHUB_OUTPUT"

  verify-macos:
    needs: resolve
    if: needs.resolve.outputs.update == 'true'
    runs-on: macos-latest
    outputs:
      formula_sha256: ${{ steps.render.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render Formula/forge.rb from the signed release
        id: render
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          .github/scripts/render-forge-formula.sh "$VERSION" Formula/forge.rb
          cat Formula/forge.rb
          echo "sha256=$(shasum -a 256 Formula/forge.rb | awk '{print $1}')" >>"$GITHUB_OUTPUT"

      - name: brew install and brew test (macOS)
        run: .github/scripts/brew-verify.sh formula "${{ needs.resolve.outputs.version }}"

  publish:
    needs: [resolve, verify-macos]
    if: needs.resolve.outputs.update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The deploy key is the only identity the "main" ruleset lets push
          # without a review. Unset, checkout falls back to GITHUB_TOKEN and
          # publish.sh opens a pull request instead.
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}

      - name: Render Formula/forge.rb from the signed release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          MACOS_SHA256: ${{ needs.verify-macos.outputs.formula_sha256 }}
        run: |
          .github/scripts/render-forge-formula.sh "$VERSION" Formula/forge.rb
          cat Formula/forge.rb
          got="$(sha256sum Formula/forge.rb | awk '{print $1}')"
          if [ "$got" != "$MACOS_SHA256" ]; then
            echo "::error::the Linux leg rendered a different formula ($got) than the macOS leg verified ($MACOS_SHA256)"
            exit 1
          fi

      - name: brew install and brew test (Linux)
        run: .github/scripts/brew-verify.sh formula "${{ needs.resolve.outputs.version }}"

      - name: Publish to main
        if: env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DEPLOY_KEY_CONFIGURED: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY != '' }}
        run: .github/scripts/publish.sh formula "$VERSION" "forge $VERSION"

  staleness:
    needs: [resolve, verify-macos, publish]
    if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail and raise an issue if the tap is behind forge's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --quiet origin main
          HAVE="$(.github/scripts/tap-version.sh formula origin/main || true)"
          read -r LATEST PUBLISHED_AT < <(gh api repos/reliant-labs/forge/releases/latest --jq '"\(.tag_name) \(.published_at)"')
          .github/scripts/staleness.sh forge "$HAVE" "${LATEST#v}" "$PUBLISHED_AT" "$STALE_AFTER_HOURS"
